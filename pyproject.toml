[project]
name = "library-tool"
version = "0.1.0"
description = "King County library pass reservation helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "schedule>=1.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]
optional-dependencies = { automation = ["playwright>=1.40.0"] }

[project.scripts]
library-tool = "src.main:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
